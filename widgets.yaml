name: "小组件"
description: "终极桌面仪表盘"

env_schema:
  MAIN_TITLE:
    name: 【主盘】标题
    description: 最上方的主显示（正计时/倒计时）
    default_value: "Our Meeting"
  MAIN_DATE:
    name: 【主盘】日期
    description: 格式：2023-05-20+ (带+号表示正计时算天数)
    default_value: "2023-05-20+"
    
  L1_T:
    name: 【左1】标题
    description: 左侧第1个倒计时
    default_value: "元旦"
  L1_D:
    name: 【左1】日期
    description: 公历格式：01-01
    default_value: "01-01"
    
  L2_T:
    name: 【左2】标题
    description: 左侧第2个倒计时
    default_value: "春节"
  L2_D:
    name: 【左2】日期
    description: 格式：01-01-L (-L表示农历)
    default_value: "01-01-L"
    
  L3_T:
    name: 【左3】标题
    description: 左侧第3个倒计时
    default_value: "清明"
  L3_D:
    name: 【左3】日期
    description: 公历格式：04-05
    default_value: "04-05"
    
  R1_T:
    name: 【右1】标题
    description: 右侧第1个倒计时
    default_value: "My DOB"
  R1_D:
    name: 【右1】日期
    description: 格式：06-13-L (-L表示农历)
    default_value: "06-13-L"
    
  R2_T:
    name: 【右2】标题
    description: 右侧第2个倒计时
    default_value: "Mom's DOB"
  R2_D:
    name: 【右2】日期
    description: 格式：08-21-L (-L表示农历)
    default_value: "08-21-L"
    
  R3_T:
    name: 【右3】标题
    description: 右侧第3个倒计时
    default_value: "Jing's DOB"
  R3_D:
    name: 【右3】日期
    description: 公历格式：10-24
    default_value: "10-24"

  TYPE:
    name: 一言类型
    description: "a=动画 b=漫画 c=游戏 d=文学 e=原创 f=网络 g=其他 h=影视 i=诗词 j=网易云 k=哲学，留空则不限"
    options:
      - ""
      - a
      - b
      - c
      - d
      - e
      - f
      - g
      - h
      - i
      - j
      - k
      
  # ⬇️ 新增：和风天气相关的环境变量定义 ⬇️
  LOCATION:
    name: 【天气】定位城市
    description: 请填写城市名称（如：长沙）或经纬度
    default_value: "长沙"
  API_HOST:
    name: 【天气】API_HOST
    description: 和风天气的请求域名
    default_value: "ma6fr87gx6.re.qweatherapi.com"
  KEY:
    name: 【天气】API KEY
    description: 和风天气开发者密钥
    default_value: "0663413329af4b9ea85aaf9cdac5be36"

scriptings:
- generic:
    name: 倒计时
    script_url: https://raw.githubusercontent.com/Double20208/Travelaroundtheworld/refs/heads/main/Countdown.js
- generic:
    name: 和风天气
    script_url: https://raw.githubusercontent.com/IBL3ND/module/refs/heads/main/Weather_Widget.JS
- generic:
    name: 一言
    script_url: https://raw.githubusercontent.com/Double20208/Travelaroundtheworld/refs/heads/main/hitokoto.js
- generic:
    name: 今日进度
    script_url: https://raw.githubusercontent.com/egerndaddy/quick-start/main/modules/daily-progress.js
- generic:
    name: 万年历
    script_url: https://raw.githubusercontent.com/Double20208/Travelaroundtheworld/refs/heads/main/Calendar.js
- generic:
    name: SpeedTest
    script_url: https://raw.githubusercontent.com/xemeiss/Script/main/Egern/Widget/SpeedTest.js
- generic:
    name: 网络面板
    script_url: https://raw.githubusercontent.com/Double20208/Travelaroundtheworld/refs/heads/main/ip.js

widgets:
- name: 倒计时
  script_name: 倒计时
# ⬇️ 新增：在仪表盘中挂载和风天气组件 ⬇️
- name: 和风天气
  script_name: 和风天气
- name: 一言
  script_name: 一言
- name: 今日进度
  script_name: 今日进度
- name: 万年历
  script_name: 万年历
- name: SpeedTest
  script_name: SpeedTest
- name: 网络面板
  script_name: 网络面板
